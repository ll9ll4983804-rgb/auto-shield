name: Build Auto Shield

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Get the official Fabric template and write the mod
        run: |
          set -e
          git clone --depth 1 https://github.com/FabricMC/fabric-example-mod.git "$RUNNER_TEMP/tpl"
          cd "$RUNNER_TEMP/tpl"
          rm -rf .git src
          mkdir -p src/client/java/com/autoshield src/main/resources

          sed -i 's/^minecraft_version=.*/minecraft_version=26.2/' gradle.properties
          sed -i 's/^loader_version=.*/loader_version=0.20.1/' gradle.properties
          sed -i 's/^fabric_version=.*/fabric_version=0.161.0+26.2/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          sed -i 's/^archives_base_name=.*/archives_base_name=auto-shield/' gradle.properties

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "autoshield",
            "version": "1.0.0",
            "name": "Auto Shield",
            "description": "Fast hotbar shield swap on incoming damage, then returns to your weapon.",
            "authors": ["Ayman"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.autoshield.AutoShieldClient"]
            },
            "depends": {
              "fabricloader": ">=0.19.3",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/client/java/com/autoshield/AutoShieldClient.java
          package com.autoshield;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.Minecraft;
          import net.minecraft.world.item.Items;

          public class AutoShieldClient implements ClientModInitializer {
              private int previousSlot = -1;
              private int activeShieldSlot = -1;
              private int holdTicks = 0;
              private int releaseTicks = 0;
              private int cooldownTicks = 0;
              private float lastHealth = -1.0f;

              private boolean blockingActive = false;
              private boolean releasingActive = false;
              private boolean manualUseHeldBeforeBlock = false;

              @Override
              public void onInitializeClient() {
                  ClientTickEvents.END_CLIENT_TICK.register(this::onClientTick);
              }

              private void onClientTick(Minecraft client) {
                  if (client.player == null) {
                      fullReset(client);
                      lastHealth = -1.0f;
                      return;
                  }

                  float currentHealth = client.player.getHealth();
                  boolean tookDamage = lastHealth > 0.0f && currentHealth < lastHealth;
                  lastHealth = currentHealth;

                  if (cooldownTicks > 0) {
                      cooldownTicks--;
                  }

                  boolean useKeyCurrentlyPressed = client.options.keyUse.isDown();

                  if (!blockingActive && !releasingActive) {
                      manualUseHeldBeforeBlock = useKeyCurrentlyPressed;
                  }

                  if (tookDamage && !blockingActive && !releasingActive && !manualUseHeldBeforeBlock && cooldownTicks == 0) {
                      int currentSlot = client.player.getInventory().getSelectedSlot();
                      int shieldSlot = findShieldInHotbar(client);

                      if (shieldSlot != -1 && shieldSlot != currentSlot) {
                          previousSlot = currentSlot;
                          activeShieldSlot = shieldSlot;
                          client.player.getInventory().setSelectedSlot(shieldSlot);
                          client.options.keyUse.setDown(true);

                          blockingActive = true;
                          releasingActive = false;
                          holdTicks = 3;
                          releaseTicks = 1;
                          cooldownTicks = 2;
                      }
                  }

                  if (blockingActive) {
                      if (!isHoldingShieldSlot(client)) {
                          restoreWeaponNow(client);
                          return;
                      }

                      if (holdTicks > 0) {
                          client.options.keyUse.setDown(true);
                          holdTicks--;
                      } else {
                          client.options.keyUse.setDown(false);
                          blockingActive = false;
                          releasingActive = true;
                      }
                  } else if (releasingActive) {
                      client.options.keyUse.setDown(false);
                      if (releaseTicks > 0) {
                          releaseTicks--;
                      } else {
                          restoreWeaponNow(client);
                      }
                  }
              }

              private boolean isHoldingShieldSlot(Minecraft client) {
                  if (client.player == null || activeShieldSlot < 0 || activeShieldSlot >= 9) {
                      return false;
                  }
                  return client.player.getInventory().getSelectedSlot() == activeShieldSlot
                          && client.player.getInventory().getItem(activeShieldSlot).is(Items.SHIELD);
              }

              private int findShieldInHotbar(Minecraft client) {
                  if (client.player == null) return -1;
                  for (int i = 0; i < 9; i++) {
                      if (client.player.getInventory().getItem(i).is(Items.SHIELD)) {
                          return i;
                      }
                  }
                  return -1;
              }

              private void restoreWeaponNow(Minecraft client) {
                  if (client != null) {
                      if (client.options != null && !manualUseHeldBeforeBlock) {
                          client.options.keyUse.setDown(false);
                      }
                      if (client.player != null && previousSlot >= 0 && previousSlot < 9) {
                          if (client.player.getInventory().getSelectedSlot() != previousSlot) {
                              client.player.getInventory().setSelectedSlot(previousSlot);
                          }
                      }
                  }
                  previousSlot = -1;
                  activeShieldSlot = -1;
                  holdTicks = 0;
                  releaseTicks = 0;
                  blockingActive = false;
                  releasingActive = false;
                  manualUseHeldBeforeBlock = false;
              }

              private void fullReset(Minecraft client) {
                  if (client != null && client.options != null) {
                      client.options.keyUse.setDown(false);
                  }
                  previousSlot = -1;
                  activeShieldSlot = -1;
                  holdTicks = 0;
                  releaseTicks = 0;
                  cooldownTicks = 0;
                  blockingActive = false;
                  releasingActive = false;
                  manualUseHeldBeforeBlock = false;
              }
          }
          EOF

      - name: Build the jar
        working-directory: ${{ runner.temp }}/tpl
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          ls -la build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: auto-shield-jar
          path: |
            ${{ runner.temp }}/tpl/build/libs/*.jar
            !${{ runner.temp }}/tpl/build/libs/*-sources.jar
