name: Build Auto Shield

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Create Fabric project files
        run: |
          set -e
          mkdir -p src/main/java/com/autoshield src/main/resources

          cat << 'EOF' > settings.gradle
          pluginManagement {
            repositories {
              maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net/'
              }
              gradlePluginPortal()
            }
          }
          rootProject.name = 'auto-shield'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
          org.gradle.parallel=true

          minecraft_version=26.2
          yarn_mappings=26.2+build.1
          loader_version=0.20.1
          loom_version=1.12-SNAPSHOT
          fabric_version=0.161.0+26.2

          mod_version=1.0.0
          maven_group=com.autoshield
          archives_base_name=auto-shield
          EOF

          cat << 'EOF' > build.gradle
          plugins {
            id 'fabric-loom' version "${loom_version}"
            id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
            archivesName = project.archives_base_name
          }

          repositories {
            maven { url = 'https://maven.fabricmc.net/' }
          }

          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
            inputs.property "version", project.version
            filesMatching("fabric.mod.json") {
              expand "version": project.version
            }
          }

          tasks.withType(JavaCompile).configureEach {
            it.options.release = 25
          }

          java {
            withSourcesJar()
            sourceCompatibility = JavaVersion.VERSION_25
            targetCompatibility = JavaVersion.VERSION_25
          }

          jar {
            from("LICENSE") {
              rename { "${it}_${project.base.archivesName.get()}"}
            }
          }
          EOF

          touch LICENSE

      - name: Configure mod metadata
        run: |
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "auto-shield",
            "version": "${version}",
            "name": "Auto Shield",
            "description": "Fast hotbar shield swap, quick block on incoming damage, and clean weapon return for 1v1 PvP.",
            "authors": [
              "Ayman"
            ],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.autoshield.AutoShieldClient"
              ]
            },
            "mixins": [
              "auto-shield.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.20.1",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Configure mixins
        run: |
          cat << 'EOF' > src/main/resources/auto-shield.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.autoshield.mixin",
            "compatibilityLevel": "JAVA_25",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

      - name: Write AutoShieldClient.java
        run: |
          cat << 'EOF' > src/main/java/com/autoshield/AutoShieldClient.java
          package com.autoshield;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.item.Items;

          public class AutoShieldClient implements ClientModInitializer {
              private int previousSlot = -1;
              private int activeShieldSlot = -1;
              private int holdTicks = 0;
              private int releaseTicks = 0;
              private int cooldownTicks = 0;
              private float lastHealth = -1.0f;

              private boolean blockingActive = false;
              private boolean releasingActive = false;
              private boolean manualUseHeldBeforeBlock = false;

              @Override
              public void onInitializeClient() {
                  ClientTickEvents.END_CLIENT_TICK.register(this::onClientTick);
              }

              private void onClientTick(MinecraftClient client) {
                  if (client.player == null) {
                      fullReset(client);
                      lastHealth = -1.0f;
                      return;
                  }

                  float currentHealth = client.player.getHealth();
                  boolean tookDamage = lastHealth > 0.0f && currentHealth < lastHealth;
                  lastHealth = currentHealth;

                  if (cooldownTicks > 0) {
                      cooldownTicks--;
                  }

                  boolean useKeyCurrentlyPressed = client.options.useKey.isPressed();

                  if (!blockingActive && !releasingActive) {
                      manualUseHeldBeforeBlock = useKeyCurrentlyPressed;
                  }

                  if (tookDamage && !blockingActive && !releasingActive && !manualUseHeldBeforeBlock && cooldownTicks == 0) {
                      int currentSlot = client.player.getInventory().selectedSlot;
                      int shieldSlot = findShieldInHotbar(client);

                      if (shieldSlot != -1 && shieldSlot != currentSlot) {
                          previousSlot = currentSlot;
                          activeShieldSlot = shieldSlot;
                          client.player.getInventory().selectedSlot = shieldSlot;
                          client.options.useKey.setPressed(true);

                          blockingActive = true;
                          releasingActive = false;
                          holdTicks = 3;
                          releaseTicks = 1;
                          cooldownTicks = 2;
                      }
                  }

                  if (blockingActive) {
                      if (!isHoldingShieldSlot(client)) {
                          restoreWeaponNow(client);
                          return;
                      }

                      if (holdTicks > 0) {
                          client.options.useKey.setPressed(true);
                          holdTicks--;
                      } else {
                          client.options.useKey.setPressed(false);
                          blockingActive = false;
                          releasingActive = true;
                      }
                  } else if (releasingActive) {
                      client.options.useKey.setPressed(false);
                      if (releaseTicks > 0) {
                          releaseTicks--;
                      } else {
                          restoreWeaponNow(client);
                      }
                  }
              }

              private boolean isHoldingShieldSlot(MinecraftClient client) {
                  if (client.player == null || activeShieldSlot < 0 || activeShieldSlot >= 9) {
                      return false;
                  }
                  return client.player.getInventory().selectedSlot == activeShieldSlot
                          && client.player.getInventory().getStack(activeShieldSlot).isOf(Items.SHIELD);
              }

              private int findShieldInHotbar(MinecraftClient client) {
                  if (client.player == null) return -1;
                  for (int i = 0; i < 9; i++) {
                      if (client.player.getInventory().getStack(i).isOf(Items.SHIELD)) {
                          return i;
                      }
                  }
                  return -1;
              }

              private void restoreWeaponNow(MinecraftClient client) {
                  if (client != null) {
                      if (client.options != null && !manualUseHeldBeforeBlock) {
                          client.options.useKey.setPressed(false);
                      }
                      if (client.player != null && previousSlot >= 0 && previousSlot < 9) {
                          if (client.player.getInventory().selectedSlot != previousSlot) {
                              client.player.getInventory().selectedSlot = previousSlot;
                          }
                      }
                  }
                  previousSlot = -1;
                  activeShieldSlot = -1;
                  holdTicks = 0;
                  releaseTicks = 0;
                  blockingActive = false;
                  releasingActive = false;
                  manualUseHeldBeforeBlock = false;
              }

              private void fullReset(MinecraftClient client) {
                  if (client != null && client.options != null) {
                      client.options.useKey.setPressed(false);
                  }
                  previousSlot = -1;
                  activeShieldSlot = -1;
                  holdTicks = 0;
                  releaseTicks = 0;
                  cooldownTicks = 0;
                  blockingActive = false;
                  releasingActive = false;
                  manualUseHeldBeforeBlock = false;
              }
          }
          EOF

      - name: Build jar
        run: gradle build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-shield-jar
          path: build/libs/*-1.0.0.jar
