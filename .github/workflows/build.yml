name: Build Auto Shield

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Create Fabric project files
        run: |
          set -e
          mkdir -p src/main/java/com/autoshield src/main/resources

          cat << 'EOF' > settings.gradle
          pluginManagement {
            repositories {
              maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net/'
              }
              gradlePluginPortal()
            }
          }
          rootProject.name = 'auto-shield'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
          org.gradle.parallel=true

          minecraft_version=1.21.4
          yarn_mappings=1.21.4+build.8
          loader_version=0.16.10
          loom_version=1.9-SNAPSHOT
          fabric_version=0.119.2+1.21.4

          mod_version=1.0.0
          maven_group=com.autoshield
          archives_base_name=auto-shield
          EOF

          cat << 'EOF' > build.gradle
          plugins {
            id 'fabric-loom' version "${loom_version}"
            id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
            archivesName = project.archives_base_name
          }

          repositories {
            maven { url = 'https://maven.fabricmc.net/' }
          }

          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
            inputs.property "version", project.version
            filesMatching("fabric.mod.json") {
              expand "version": project.version
            }
          }

          tasks.withType(JavaCompile).configureEach {
            it.options.release = 21
          }

          java {
            withSourcesJar()
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
          }

          jar {
            from("LICENSE") {
              rename { "${it}_${project.base.archivesName.get()}"}
            }
          }
          EOF

          touch LICENSE

      - name: Configure mod metadata
        run: |
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "auto-shield",
            "version": "${version}",
            "name": "Auto Shield",
            "description": "Fast hotbar shield swap, quick block on incoming damage, and clean weapon return for 1v1 PvP.",
            "authors": [
              "Ayman"
            ],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.autoshield.AutoShieldClient"
              ]
            },
            "mixins": [
              "auto-shield.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.16.0",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Configure mixins
        run: |
          cat << 'EOF' > src/main/resources/auto-shield.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.autoshield.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

      - name: Write AutoShieldClient.java
        run: |
          cat << 'EOF' > src/main/java/com/autoshield/AutoShieldClient.java
          package com.autoshield;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.item.Items;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          public class AutoShieldClient implements ClientModInitializer {
              private static boolean enabled = true;
              private static KeyBinding toggleKey;

              private int previousSlot = -1;
              private int holdTicks = 0;
              private int returnDelayTicks = 0;
              private int cooldownTicks = 0;
              private float lastHealth = -1.0f;
              private boolean blockingActive = false;
              private boolean manualUseOverride = false;

              @Override
              public void onInitializeClient() {
                  toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.auto-shield.toggle",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_UNKNOWN,
                          "category.auto-shield"
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(this::onClientTick);
              }

              private void onClientTick(MinecraftClient client) {
                  if (client.player == null) {
                      resetAll(client);
                      lastHealth = -1.0f;
                      return;
                  }

                  while (toggleKey.wasPressed()) {
                      enabled = !enabled;
                      client.player.sendMessage(
                              Text.literal("§6[Auto Shield] §fStatus: " + (enabled ? "§aON" : "§cOFF")),
                              true
                      );
                      if (!enabled) {
                          restoreWeaponAndRelease(client);
                      }
                  }

                  float currentHealth = client.player.getHealth();
                  boolean healthDropped = lastHealth > 0.0f && currentHealth < lastHealth;
                  lastHealth = currentHealth;

                  if (cooldownTicks > 0) {
                      cooldownTicks--;
                  }

                  if (!enabled) {
                      return;
                  }

                  if (!blockingActive && client.options.useKey.isPressed()) {
                      manualUseOverride = true;
                  } else if (!client.options.useKey.isPressed()) {
                      manualUseOverride = false;
                  }

                  if (healthDropped && !blockingActive && !manualUseOverride && cooldownTicks == 0) {
                      int currentSlot = client.player.getInventory().selectedSlot;
                      int shieldSlot = findShieldInHotbar(client);

                      if (shieldSlot != -1 && shieldSlot != currentSlot) {
                          previousSlot = currentSlot;
                          client.player.getInventory().selectedSlot = shieldSlot;
                          client.options.useKey.setPressed(true);
                          blockingActive = true;
                          holdTicks = 3;
                          returnDelayTicks = 1;
                          cooldownTicks = 3;
                      }
                  }

                  if (blockingActive) {
                      if (holdTicks > 0) {
                          holdTicks--;
                          client.options.useKey.setPressed(true);
                      } else {
                          client.options.useKey.setPressed(false);
                          if (returnDelayTicks > 0) {
                              returnDelayTicks--;
                          } else {
                              restoreWeaponAndRelease(client);
                          }
                      }
                  }
              }

              private int findShieldInHotbar(MinecraftClient client) {
                  if (client.player == null) return -1;
                  for (int i = 0; i < 9; i++) {
                      if (client.player.getInventory().getStack(i).isOf(Items.SHIELD)) {
                          return i;
                      }
                  }
                  return -1;
              }

              private void restoreWeaponAndRelease(MinecraftClient client) {
                  if (client.player != null) {
                      client.options.useKey.setPressed(false);
                      if (previousSlot >= 0 && previousSlot < 9 && previousSlot != client.player.getInventory().selectedSlot) {
                          client.player.getInventory().selectedSlot = previousSlot;
                      }
                  }
                  resetState();
              }

              private void resetState() {
                  previousSlot = -1;
                  holdTicks = 0;
                  returnDelayTicks = 0;
                  blockingActive = false;
              }

              private void resetAll(MinecraftClient client) {
                  if (client != null && client.options != null) {
                      client.options.useKey.setPressed(false);
                  }
                  cooldownTicks = 0;
                  manualUseOverride = false;
                  resetState();
              }
          }
          EOF

      - name: Build jar
        run: gradle build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-shield-jar
          path: build/libs/*-1.0.0.jar
